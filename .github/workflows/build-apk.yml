name: Build حساباتك APK

# Trigger this manually from the "Actions" tab on GitHub (workflow_dispatch),
# or automatically on every push to main. Either way, no Flutter/Android
# Studio install is needed on your own machine — GitHub's servers do it.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should call (e.g. your Render URL)"
        required: true
        default: "http://10.0.2.2:8000"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Generate missing Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org com.hesabatak .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate app icon from assets/icon/icon.png
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Set app display name to حساباتك
        working-directory: mobile
        # flutter create (above) regenerates AndroidManifest.xml fresh every
        # run with a generic label, so the display name has to be patched
        # back in after create but before build, every single time.
        run: |
          sed -i 's/android:label="[^"]*"/android:label="حساباتك"/' android/app/src/main/AndroidManifest.xml
          grep android:label android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://10.0.2.2:8000' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabatak-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
