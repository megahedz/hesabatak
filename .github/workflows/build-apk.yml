name: Build حساباتك APK

# Trigger manually from the "Actions" tab (workflow_dispatch), or
# automatically on every push to main. No local Flutter install needed.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should call (e.g. your Render URL)"
        required: true
        default: "https://hesabatak-backend-srps.onrender.com"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 3.35 ships a modern Kotlin Gradle plugin (2.x) + AGP/SDK 36, so no
          # Kotlin/compileSdk patching is needed for the Phase 6 plugins
          # (connectivity_plus, share_plus, flutter_secure_storage...).
          flutter-version: "3.35.0"
          channel: "stable"

      - name: Generate missing Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org com.hesabatak .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate app icon (if configured in pubspec.yaml)
        working-directory: mobile
        run: |
          if grep -q flutter_launcher_icons pubspec.yaml && [ -f assets/icon/icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "Icon not configured, skipping"
          fi

      # Google Sign-In (توقيع SHA-1 مطلوب في Google Cloud Console):
      # 1) حرّر المفاتيح من GitHub: Settings → Secrets → GOOGLE_SERVICES_JSON
      # 2) من Google Cloud Console (APIs & Services → Credentials):
      #    - أنشئ OAuth 2.0 Client ID نوع Android، مع:
      #      package name = com.hesabatak.hesabatak
      #      SHA-1 = بصمة مفتاح التوقيع (من keystore أو من Play App Signing)
      #    - فعّل Google Sign-In API (أو خدمات Play الأساسية)
      # 3) أضف WEB_CLIENT_ID (نوع Web Application) كـ repository secret،
      #    يُمرَّر للتطبيق عبر --dart-define=GOOGLE_WEB_CLIENT_ID=...
      # 4) ضع google-services.json في GOOGLE_SERVICES_JSON secret وألصقه هنا:
      #    echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/android/app/google-services.json
      # (الخطوات 1-4 لا تمنع البناء الآن؛ زر جوجل يعرض رسالة إعداد حتى تكتمل)

      # - name: Restore google-services.json
      #   working-directory: mobile
      #   run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Patch AndroidManifest (app name + internet permission)
        working-directory: mobile
        # flutter create regenerates the manifest fresh every run, so these
        # patches must be re-applied every run, after create and before build.
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="حساباتك"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' $M
          echo "--- manifest check ---"
          grep -n 'android:label\|permission.INTERNET' $M

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://hesabatak-backend-srps.onrender.com' }}

      # اسم الملف النهائي يحمل اسم البرنامج ورقم الإصدار، مثل:
      # hesabatak-0.7.4.apk — مباشرة من pubspec.yaml (version: 0.7.4+11)
      - name: Rename APK with app name + version
        working-directory: mobile
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          OUT=build/app/outputs/flutter-apk
          mv "$OUT/app-release.apk" "$OUT/hesabatak-$VERSION.apk"
          echo "hesabatak-$VERSION.apk"
          ls -la "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabatak-app
          path: mobile/build/app/outputs/flutter-apk/hesabatak-*.apk

  # ========================================================================
  # نسخة الويب: نفس الكود يُبنى للمتصفح ويُنشر على GitHub Pages — يفتح من
  # أي كمبيوتر على: https://megahedz.github.io/hesabatak/
  # (النسخة على الويب تعمل online-only: بدون كاش محلي أو طابور مزامنة)
  # ========================================================================
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: "stable"

      - name: Generate web platform scaffold
        working-directory: mobile
        run: flutter create --platforms web .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build web (with production API base URL)
        working-directory: mobile
        run: >
          flutter build web --release --base-href /hesabatak/
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://hesabatak-backend-srps.onrender.com' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
