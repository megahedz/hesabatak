name: Build حساباتك APK

# Trigger this manually from the "Actions" tab on GitHub (workflow_dispatch),
# or automatically on every push to main. Either way, no Flutter/Android
# Studio install is needed on your own machine — GitHub's servers do it.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should call (e.g. your Render URL)"
        required: true
        default: "https://hesabatak-backend-srps.onrender.com"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Generate missing Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org com.hesabatak .

      # flutter create (Flutter 3.24.0) stamps Kotlin Gradle plugin 1.7.10 into
      # android/settings.gradle, but flutter_secure_storage pulls in
      # kotlin-stdlib 1.9.24 whose 1.9.0 metadata the 1.7.10 compiler cannot
      # read -> ":app:compileReleaseKotlin" fails with "Module was compiled
      # with an incompatible version of Kotlin". Bump the plugin so the
      # compiler can read the stdlib's metadata.
      - name: Bump Kotlin Gradle plugin to 1.9.24
        working-directory: mobile
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          grep 'org.jetbrains.kotlin.android' android/settings.gradle

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate app icon from assets/icon/icon.png
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Set app display name to حساباتك
        working-directory: mobile
        # flutter create (above) regenerates AndroidManifest.xml fresh every
        # run with a generic label, so the display name has to be patched
        # back in after create but before build, every single time.
        run: |
          sed -i 's/android:label="[^"]*"/android:label="حساباتك"/' android/app/src/main/AndroidManifest.xml
          grep android:label android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://hesabatak-backend-srps.onrender.com' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabatak-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
