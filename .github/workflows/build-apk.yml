name: Build حساباتك APK

# Trigger manually from the "Actions" tab (workflow_dispatch), or
# automatically on every push to main. No local Flutter install needed.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should call (e.g. your Render URL)"
        required: true
        default: "https://hesabatak-backend-srps.onrender.com"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 3.35 ships a modern Kotlin Gradle plugin (2.x) + AGP/SDK 36, so no
          # Kotlin/compileSdk patching is needed for the Phase 6 plugins
          # (connectivity_plus, share_plus, flutter_secure_storage...).
          flutter-version: "3.35.0"
          channel: "stable"

      - name: Generate missing Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org com.hesabatak .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate app icon (if configured in pubspec.yaml)
        working-directory: mobile
        run: |
          if grep -q flutter_launcher_icons pubspec.yaml && [ -f assets/icon/icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "Icon not configured, skipping"
          fi

      - name: Patch AndroidManifest (app name + internet permission)
        working-directory: mobile
        # flutter create regenerates the manifest fresh every run, so these
        # patches must be re-applied every run, after create and before build.
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="حساباتك"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' $M
          echo "--- manifest check ---"
          grep -n 'android:label\|permission.INTERNET' $M

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://hesabatak-backend-srps.onrender.com' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabatak-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
