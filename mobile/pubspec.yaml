name: hesabatak
description: "حساباتك - حسابات مشروعك ببساطة"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  characters: ^1.3.0
  # sqlite/drift + connectivity/sync packages are added in Phase 2 once
  # offline-first sync (spec §42) is implemented.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Run `dart run flutter_launcher_icons` (or let the CI workflow do it) to
# regenerate android/app/src/main/res/mipmap-*/ from assets/icon/icon.png
# whenever the icon image changes.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
