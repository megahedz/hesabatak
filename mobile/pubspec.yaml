name: hesabatak
description: "حساباتك - حسابات مشروعك ببساطة"
publish_to: 'none'
version: 0.7.11+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2            # multipart upload content-types (المرفقات)
  web: ^1.1.0                    # browser APIs for web build (تنزيل الملفات على الويب)
  intl: any                      # resolved to the version pinned by flutter_localizations
  characters: ^1.3.0
  flutter_secure_storage: ^9.2.2  # Phase 5: persistent session (Android Keystore)
  # Backup/export files + the tiny last-known-payload UI cache (NOT a primary
  # store — the server's cloud database is the single source of truth).
  sqflite: ^2.3.0                # legacy queue drain (older versions) + UI cache
  path: ^1.9.0
  connectivity_plus: ^6.0.3      # online/offline banner only (writes are online-only)
  share_plus: ^11.0.0            # share/download backup & export files (v11 API: SharePlus.instance.share)
  file_picker: ^8.0.3            # pick a backup file for restore
  path_provider: ^2.1.2          # temp dir for shared export/backup files
  # sqlite/drift + connectivity/sync packages are added in Phase 2 once
  # offline-first sync (spec §42) is implemented.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Run `dart run flutter_launcher_icons` (or let the CI workflow do it) to
# regenerate android/app/src/main/res/mipmap-*/ from assets/icon/icon.png
# whenever the icon image changes.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png
