<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="حساباتك — حسابات مشروعك ببساطة: مبيعات، مشتريات، مصروفات وتقارير.">
  <meta name="theme-color" content="#1A5C9E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حساباتك">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>حساباتك</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6F9FD;
    }
    /* شاشة تحميل بالتدرّج نفسه المستخدم في الأزرار — تختفي عند أول إطار. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: linear-gradient(135deg, #AF40FF 0%, #5B42F3 50%, #00DDEB 100%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      z-index: 9999;
    }
    #splash .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 34px 44px;
      border-radius: 22px;
      background: rgba(5, 6, 45, 0.86);
      box-shadow: 0 18px 40px rgba(5, 6, 45, 0.35);
    }
    #splash .name { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    #splash .tag { font-size: 13px; opacity: 0.75; }
    #splash .bar {
      width: 132px;
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.18);
      margin-top: 8px;
    }
    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #fff;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="card">
      <div class="name">حساباتك</div>
      <div class="tag">حسابات مشروعك ببساطة</div>
      <div class="bar"><span></span></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
