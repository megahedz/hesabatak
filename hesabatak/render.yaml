services:
  - type: web
    name: hesabatak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HESABATAK_SECRET_KEY
        generateValue: true   # Render generates a real random secret for you automatically
    plan: free
